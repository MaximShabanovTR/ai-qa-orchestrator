[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: pure Python, no I/O, no LLM calls
    contract: mocked Claude client, tests agent wiring
    smoke: real LLM call, schema validity only
    eval: real LLM call, rubric-based quality checks

addopts = -m "not smoke and not eval"

filterwarnings =
    ignore::pytest.PytestCollectionWarning
